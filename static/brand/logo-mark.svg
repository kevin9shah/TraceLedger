<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- TraceLedger Thread T Mark: 16px legible, Navy #16213E on paper #FDF9F0 -->
  <!-- Crossbar -->
  <line x1="6" y1="7" x2="26" y2="7" stroke="#16213E" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="6" cy="7" r="2.2" fill="#16213E"/>
  <circle cx="26" cy="7" r="2.2" fill="#16213E"/>
  <!-- Top Node -->
  <circle cx="16" cy="7" r="2.5" fill="#16213E"/>
  <!-- Top solid segment -->
  <line x1="16" y1="7" x2="16" y2="15" stroke="#16213E" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Middle Node -->
  <circle cx="16" cy="15" r="2.2" fill="#16213E"/>
  <!-- Middle dashed segment (the investigative gap / missing evidence) -->
  <line x1="16" y1="15" x2="16" y2="23" stroke="#9A948A" stroke-width="2.2" stroke-dasharray="2 2" stroke-linecap="round"/>
  <!-- Lower Node -->
  <circle cx="16" cy="23" r="2.2" fill="#16213E"/>
  <!-- Lower solid segment -->
  <line x1="16" y1="23" x2="16" y2="28" stroke="#16213E" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Terminal Node -->
  <circle cx="16" cy="28" r="2.5" fill="#16213E"/>
</svg>
